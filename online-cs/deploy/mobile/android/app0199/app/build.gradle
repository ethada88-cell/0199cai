plugins {
    id "com.android.application"
}

android {
    namespace "com.ojy0871.app0199"
    compileSdk 34

    defaultConfig {
        applicationId "com.ojy0871.app0199"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            storeFile file("/tmp/app0199/app0199.keystore")
            storePassword "app0199store"
            keyAlias "app0199"
            keyPassword "app0199store"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }
}
