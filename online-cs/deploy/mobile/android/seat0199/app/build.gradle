        applicationId "com.ojy0871.seat0199"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "1.2.1"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
