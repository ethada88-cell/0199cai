# 六合资料：同源反代上游资料站，并覆盖 kjbox.js（澳门/香港开奖互斥显示）
    location = /_m/liuhe/js/kjbox.js {
        alias /www/wwwroot/online-cs/web/c/liuhe/kjbox.js;
        default_type application/javascript;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Access-Control-Allow-Origin *;
    }
    location ^~ /_m/liuhe/ {
        proxy_pass https://123.wz.0199001.app:2999/;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_ssl_name 123.wz.0199001.app;
        proxy_set_header Host 123.wz.0199001.app:2999;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        add_header X-Frame-Options "" always;
        add_header Cache-Control "no-store" always;
    }
