  <script>
    /* Fire session create before CSS and company info. In-app browsers often die in that gap. */
    (function () {
      try {
        var m = (location.pathname || "").match(/\/c\/([a-z0-9-]+)\/?/i);
        var slug = m ? m[1].toLowerCase() : "";
        var agent = "";
        try { agent = (new URLSearchParams(location.search).get("a") || "").trim().toLowerCase(); } catch (e) {}
        if (!slug || !agent) return;
        var sidKey = "ocs_visitor_sid_" + slug + "_" + agent;
        var tokKey = "ocs_visitor_tok_" + slug + "_" + agent;
        var sid = "", tok = "";
        try {
          sid = localStorage.getItem(sidKey) || sessionStorage.getItem(sidKey) || "";
          tok = localStorage.getItem(tokKey) || sessionStorage.getItem(tokKey) || "";
        } catch (e) {}
        window.__ocsEarlyCompany = fetch("/v1/public/companies/" + encodeURIComponent(slug) + "?a=" + encodeURIComponent(agent)).then(function (r) {
          return r.json().catch(function () { return {}; });
        });
        if (sid && tok) {
          window.__ocsEarlyMsgs = fetch("/v1/visitor/sessions/" + encodeURIComponent(sid) + "/messages?_=" + Date.now(), {
            headers: { "X-Visitor-Token": tok }
          }).then(function (r) {
            return r.json().catch(function () { return {}; }).then(function (j) { return { status: r.status, j: j }; });
          });
          return;
        }
        var fp = "";
        try {
          fp = localStorage.getItem("ocs_device_fp") || "";
          if (!fp) {
            fp = (window.crypto && crypto.randomUUID && crypto.randomUUID()) ||
              ("fp_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 12));
            localStorage.setItem("ocs_device_fp", fp);
          }
          fp = String(fp).slice(0, 64);
        } catch (e) { fp = ""; }
        var fromHost = "";
        try { fromHost = (new URLSearchParams(location.search).get("from") || "").trim(); } catch (e) {}
        var embed = "";
        try {
          if (location.ancestorOrigins && location.ancestorOrigins.length) embed = String(location.ancestorOrigins[0] || "");
        } catch (e) {}
        window.__ocsEarlySession = fetch("/v1/visitor/sessions", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          keepalive: true,
          body: JSON.stringify({
            slug: slug,
            name: "网页访客",
            agent_code: agent,
            device_fp: fp,
            from_host: fromHost,
            embed_origin: embed,
            page_referrer: document.referrer || "",
            page_host: location.host || ""
          })
        }).then(function (r) {
          return r.json().catch(function () { return {}; }).then(function (j) { return { ok: r.ok, j: j }; });
        });
      } catch (e) {}
    })();
  </script>

  <!-- 内嵌官网地址加密；运行时解密，页面源码不出现明文站点 -->
  <script>
    window.__OCS_SITE_CFG = {
      d: "505793A55631ABD0A200B220D8F9080F88995CF25D6385689E0DC08CE940EE5D45133AE59ABB0EDC520D9F1A1A3B2ADE",
      k: "01sg4CXbluB1it3b",
      i: "Tssmyuzo24eraO5f"
    };
    window.__ocsDecryptSiteOrigin = async function () {
      try {
        var cfg = window.__OCS_SITE_CFG || {};
        var hex = String(cfg.d || "").trim();
        var keyStr = String(cfg.k || "");
        var ivStr = String(cfg.i || "");
        if (!hex || keyStr.length !== 16 || ivStr.length !== 16) return "";
        var bytes = new Uint8Array(hex.length / 2);
        for (var n = 0; n < bytes.length; n++) bytes[n] = parseInt(hex.substr(n * 2, 2), 16);
        var key = await crypto.subtle.importKey(
          "raw",
          new TextEncoder().encode(keyStr),
          { name: "AES-CBC" },
          false,
          ["decrypt"]
        );
        var plain = await crypto.subtle.decrypt(
          { name: "AES-CBC", iv: new TextEncoder().encode(ivStr) },
          key,
          bytes
        );
        var json = JSON.parse(new TextDecoder().decode(plain) || "{}");
        var origin = String(json.origin || "").trim().replace(/\/$/, "");
        if (!/^https?:\/\//i.test(origin)) return "";
        return origin;
      } catch (e) {
        return "";
      }
    };
  </script>

  <script>
    (() => {
      const detailText = (d) => {
        if (!d) return "";
        if (typeof d === "string") return d;
        if (Array.isArray(d)) return d.map((x) => (x && x.msg) || String(x)).join("; ");
        if (typeof d === "object" && d.detail) return detailText(d.detail);
        try { return JSON.stringify(d); } catch (_) { return String(d); }
      };
      const showErr = (t) => {
        let s = detailText(t) || t || "";
        if (/Failed to fetch|NetworkError|Load failed|网络/i.test(String(s))) {
          s = "网络异常，请稍后重试或切换网络";
        }
        document.getElementById("err").textContent = s;
      };
      const msgs = document.getElementById("msgs");
      const input = document.getElementById("input");
      const sendBtn = document.getElementById("send");
      let sid = "";
      let vtok = "";
      let slug = "";
      let agentCode = "";
      let meta = null;
      let defaultAgentName = "";
      let closed = false;
      let rated = false;
      let pickStar = 0;
      let live = false;
      let pullBusy = false, pullTimer = null, wsObj = null, wsRetry = 0, wsWanted = false;
      let lastMsgId = "";
      let visitorHasSpoken = false;
      // True while the visitor is already at the latest line. Scrolling up to
      // read earlier messages turns this off so polls cannot yank the thread.
      let visitorPinned = true;
      let wsOk = false;
      let lastWsAt = 0;
      let pendingPasteFile = null;
      let pendingPasteUrl = "";
      let typingHideTimer = null;
      let audioCtx = null;
      let soundUnlocked = false;
      let remindTimers = [];
      let remindToken = 0;
      let pendingRemind = false;
      const seenMsgIds = new Set();

      function newClientMsgId() {
        return "c_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 10);
      }
      function sleep(ms) {
        return new Promise((r) => setTimeout(r, ms));
      }
      /** Visitor POST /messages with client_msg_id + retry (server ACK + dedupe). */
      async function postVisitorMessage(payload, maxTries) {
        const body = Object.assign({}, payload || {});
        if (!body.client_msg_id) body.client_msg_id = newClientMsgId();
        const tries = Math.max(1, maxTries || 5);
        let lastErr = null;
        for (let i = 0; i < tries; i++) {
          try {
            const r = await fetch("/v1/visitor/sessions/" + sid + "/messages", {
              method: "POST",
              headers: visitorHeaders({ "Content-Type": "application/json" }),
              body: JSON.stringify(body),
            });
            const j = await r.json().catch(() => ({}));
            if (!r.ok) {
              const msg = detailText(j.detail) || "发送失败";
              if (/会话已结束|不能为空|不支持|无权|无效/.test(msg)) {
                const err = new Error(msg);
                err.fatal = true;
                throw err;
              }
              throw new Error(msg);
            }
            return j;
          } catch (err) {
            lastErr = err;
            if (err && err.fatal) throw err;
            await sleep(Math.min(6000, 350 * Math.pow(2, i)));
          }
        }
        throw lastErr || new Error("发送失败");
      }

      function getAudioCtx() {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        if (!audioCtx) audioCtx = new AC();
        return audioCtx;
      }
      function beepOnce(duration, freq, volume) {
        const ctx = getAudioCtx();
        if (!ctx) return;
        if (ctx.state === "suspended") ctx.resume();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.value = freq || 880;
        gain.gain.value = volume == null ? 0.2 : volume;
        osc.connect(gain);
        gain.connect(ctx.destination);
        const now = ctx.currentTime;
        gain.gain.setValueAtTime(gain.gain.value, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + (duration || 0.2));
        osc.start(now);
        osc.stop(now + (duration || 0.2) + 0.02);
      }
      function unlockSound() {
        const first = !soundUnlocked;
        soundUnlocked = true;
        try {
          const ctx = getAudioCtx();
          if (ctx && ctx.state === "suspended") ctx.resume();
          if (first) beepOnce(0.01, 440, 0.01);
        } catch (_) {}
        if (pendingRemind) startVisitorRemind();
      }
      function stopVisitorRemind() {
        pendingRemind = false;
        remindToken += 1;
        remindTimers.forEach((id) => clearTimeout(id));
        remindTimers = [];
      }
      function startVisitorRemind() {
        stopVisitorRemind();
        if (!soundUnlocked) {
          pendingRemind = true;
          return;
        }
        pendingRemind = false;
        const token = remindToken;
        const play = () => {
          if (token !== remindToken) return;
          try { beepOnce(0.16, 920, 0.22); } catch (_) {}
        };
        play();
        remindTimers.push(setTimeout(play, 650));
        remindTimers.push(setTimeout(play, 1300));
      }
      function msgKey(m) {
        if (!m) return "";
        if (m.id) return String(m.id);
        return [m.role || "", m.time || "", m.text || "", m.file_url || ""].join("|");
      }
      function noteIncoming(items, allowAlert) {
        let hasAgent = false;
        (items || []).forEach((m) => {
          const key = msgKey(m);
          if (!key || seenMsgIds.has(key)) return;
          seenMsgIds.add(key);
          if (m.role && m.role !== "visitor" && m.role !== "system") hasAgent = true;
        });
        if (allowAlert && hasAgent) startVisitorRemind();
      }

      const sidKey = () => "ocs_visitor_sid_" + slug + (agentCode ? "_" + agentCode : "");
      const tokKey = () => "ocs_visitor_tok_" + slug + (agentCode ? "_" + agentCode : "");
      const DEVICE_FP_KEY = "ocs_device_fp";

      function getDeviceFp() {
        try {
          let fp = localStorage.getItem(DEVICE_FP_KEY) || "";
          if (!fp) {
            fp = (crypto.randomUUID && crypto.randomUUID()) ||
              ("fp_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 12));
            localStorage.setItem(DEVICE_FP_KEY, fp);
          }
          return String(fp).slice(0, 64);
        } catch (_) {
          return "";
        }
      }

      function visitorHeaders(extra) {
        const h = Object.assign({}, extra || {});
        if (vtok) h["X-Visitor-Token"] = vtok;
        return h;
      }
      function saveCreds() {
        if (!slug) return;
        // 同设备续聊：同时写入 localStorage + sessionStorage
        try {
          if (sid) localStorage.setItem(sidKey(), sid); else localStorage.removeItem(sidKey());
          if (vtok) localStorage.setItem(tokKey(), vtok); else localStorage.removeItem(tokKey());
        } catch (_) {}
        if (sid) sessionStorage.setItem(sidKey(), sid); else sessionStorage.removeItem(sidKey());
        if (vtok) sessionStorage.setItem(tokKey(), vtok); else sessionStorage.removeItem(tokKey());
      }
      function clearCreds() {
        sid = "";
        vtok = "";
        try { localStorage.removeItem(sidKey()); localStorage.removeItem(tokKey()); } catch (_) {}
        sessionStorage.removeItem(sidKey());
        sessionStorage.removeItem(tokKey());
      }
      function loadCreds() {
        try {
          sid = localStorage.getItem(sidKey()) || sessionStorage.getItem(sidKey()) || "";
          vtok = localStorage.getItem(tokKey()) || sessionStorage.getItem(tokKey()) || "";
        } catch (_) {
          sid = sessionStorage.getItem(sidKey()) || "";
          vtok = sessionStorage.getItem(tokKey()) || "";
        }
      }

      let readTimer = null;
      let readInFlight = false;
      function markAgentMessagesRead(reason) {
        if (!sid || !vtok || !live) return;
        if (document.hidden) return;
        // Greeting-only ad opens must not POST /read — that UPDATE+WS storm
        // froze seat workbenches before peak.
        if (!visitorHasSpoken) return;
        if (readTimer) clearTimeout(readTimer);
        readTimer = setTimeout(async () => {
          readTimer = null;
          if (readInFlight || !sid || !vtok || document.hidden) return;
          // 取当前已展示的最后一条客服消息 id，避免误标未看到的历史
          let upTo = "";
          try {
            const nodes = msgs.querySelectorAll('.bubble.them[data-mid], .bubble.them');
            // appendItems uses data-mid on bubble; render() historically may omit it — fallback lastMsgId
            for (let i = nodes.length - 1; i >= 0; i--) {
              const id = nodes[i].getAttribute("data-mid") || "";
              if (id && !String(id).startsWith("tmp_")) { upTo = id; break; }
            }
            if (!upTo && lastMsgId && !String(lastMsgId).startsWith("tmp_")) upTo = lastMsgId;
          } catch (_) {}
          readInFlight = true;
          try {
            const q = upTo ? ("?up_to_id=" + encodeURIComponent(upTo)) : "";
            await fetch("/v1/visitor/sessions/" + encodeURIComponent(sid) + "/read" + q, {
              method: "POST",
              headers: visitorHeaders(),
            });
          } catch (_) {
          } finally {
            readInFlight = false;
          }
        }, reason === "immediate" ? 50 : 400);
      }


      function agentInitial(name) {
        const s = String(name || "客").trim();
        return (s[0] || "客").toUpperCase();
      }
      function agentAvatarHtml(name) {
        return `<div class="msg-av">${esc(agentInitial(name))}</div>`;
      }
      function syncAgentCard(name, welcome) {
        const n = (name || defaultAgentName || "客服").trim() || "客服";
        defaultAgentName = n;
        const nameEl = document.getElementById("agentName");
        const welEl = document.getElementById("agentWelcome");
        const av = document.getElementById("agentAv");
        if (nameEl) nameEl.textContent = n;
        if (welEl) welEl.textContent = (welcome || "").trim() || ("欢迎联系我们");
        if (av) av.textContent = agentInitial(n);
      }
      function updateSendReady() {
        const btn = document.getElementById("send");
        if (!btn) return;
        const has = !!(input && !input.disabled && String(input.value || "").trim()) || !!pendingPasteFile;
        btn.classList.toggle("ready", has && !btn.disabled);
      }
      function msgHtml(m) {
        if (m.role === "system") {
          return `<div class="msg-row system"><div class="bubble system" data-mid="${esc(m.id || "")}">${linkifyText(m.text)}</div></div>`;
        }
        const me = m.role === "visitor";
        const who = me ? "我" : visitorAgentWho(m);
        let body = mediaBody(m) || linkifyText(m.text || "");
        const av = me ? "" : agentAvatarHtml(who);
        return `<div class="msg-row ${me ? "me" : "them"}">${av}<div class="bubble ${me ? "me" : "them"}" data-mid="${esc(m.id || "")}">${body}<div class="time">${esc(m.time || "")}</div></div></div>`;
      }

      function visitorAgentWho(m) {
        const a = ((m && m.agent) || "").trim();
        if (a && !/^渠道\d+$/.test(a)) return a;
        return defaultAgentName || "客服";
      }

      function render(items) {
        msgs.innerHTML = (items || []).map((m) => msgHtml(m)).join("");
        stickVisitorBottom(true);
        const last = items && items.length ? items[items.length - 1] : null;
        if (last && last.id && !String(last.id).startsWith("tmp_")) lastMsgId = last.id;
        noteIncoming(items, live);
        if ((items || []).some((m) => m && m.role === "visitor")) visitorHasSpoken = true;
        markAgentMessagesRead();
        const badge = document.getElementById("agentBadge");
        if (badge) {
          const n = (items || []).filter((m) => m && m.role === "agent").length ? 1 : 0;
          if (n) { badge.hidden = false; badge.textContent = String(n); }
        }
      }
      function setTypingHint(on) {
        const hint = document.getElementById("typingHint");
        if (typingHideTimer) { clearTimeout(typingHideTimer); typingHideTimer = null; }
        const row = document.getElementById("typingRow");
        if (!on || closed) {
          if (hint) hint.classList.remove("show");
          if (row) row.remove();
          return;
        }
        if (hint) hint.classList.add("show");
        let bubble = row;
        if (!bubble) {
          bubble = document.createElement("div");
          bubble.id = "typingRow";
          bubble.className = "msg-row them";
          const who = defaultAgentName || "坐席";
          bubble.innerHTML = `${agentAvatarHtml(who)}<div class="bubble them typing-row">坐席正在输入…</div>`;
          msgs.appendChild(bubble);
        } else {
          msgs.appendChild(bubble);
        }
        if (visitorPinned) msgs.scrollTop = msgs.scrollHeight;
        typingHideTimer = setTimeout(() => setTypingHint(false), 5000);
      }
      function bubbleShown(id) {
        if (!id || !msgs) return false;
        const key = String(id).replace(/"/g, "");
        return !!msgs.querySelector('[data-mid="' + key + '"]');
      }
      function noteVisitorScroll() {
        if (!msgs) return;
        const gap = msgs.scrollHeight - msgs.scrollTop - msgs.clientHeight;
        visitorPinned = gap < 80;
      }
      function stickVisitorBottom(force) {
        if (!msgs) return;
        if (force) visitorPinned = true;
        const go = () => {
          if (!msgs || !visitorPinned) return;
          msgs.scrollTop = msgs.scrollHeight;
        };
        go();
        requestAnimationFrame(go);
        setTimeout(go, 60);
        setTimeout(go, 400);
      }
      function bindVisitorReading() {
        if (!msgs || msgs.dataset.readingBound) return;
        msgs.dataset.readingBound = "1";
        let touchY = 0;
        msgs.addEventListener("scroll", noteVisitorScroll, { passive: true });
        msgs.addEventListener("wheel", (e) => {
          if (e.deltaY < 0) visitorPinned = false;
          else noteVisitorScroll();
        }, { passive: true });
        msgs.addEventListener("touchstart", (e) => {
          const t = e.touches && e.touches[0];
          touchY = t ? t.clientY : 0;
        }, { passive: true });
        msgs.addEventListener("touchmove", (e) => {
          const t = e.touches && e.touches[0];
          if (!t) return;
          const dy = t.clientY - touchY;
          touchY = t.clientY;
          if (dy > 3) visitorPinned = false;
          else noteVisitorScroll();
        }, { passive: true });
      }
      bindVisitorReading();
      const btnRefresh = document.getElementById("btnRefresh");
      if (btnRefresh) btnRefresh.addEventListener("click", () => location.reload());
      if (input) {
        input.addEventListener("input", updateSendReady);
        input.addEventListener("change", updateSendReady);
      }

      function appendItems(items) {
        if (!items || !items.length) return;
        const frag = document.createDocumentFragment();
        let added = 0;
        let own = false;
        items.forEach((m) => {
          if (m && m.id) {
            const id = String(m.id);
            if (seenMsgIds.has(id) && bubbleShown(id)) return;
            seenMsgIds.add(id);
          }
          added += 1;
          if (m && m.role === "visitor") own = true;
          const wrap = document.createElement("div");
          wrap.innerHTML = msgHtml(m);
          while (wrap.firstChild) frag.appendChild(wrap.firstChild);
          // 乐观 tmp_* 不能写入 after 游标，否则服务端未知 id 会返回空增量，双方收不到后续消息
          if (m.id && !String(m.id).startsWith("tmp_")) lastMsgId = m.id;
        });
        if (!added) return;
        msgs.appendChild(frag);
        const keepTyping = document.getElementById("typingRow");
        if (keepTyping) msgs.appendChild(keepTyping);
        stickVisitorBottom(own);
        msgs.querySelectorAll("img").forEach((img) => {
          if (img.dataset.stickBound) return;
          img.dataset.stickBound = "1";
          if (img.complete) return;
          img.addEventListener("load", () => stickVisitorBottom(false), { once: true });
          img.addEventListener("error", () => stickVisitorBottom(false), { once: true });
        });
        noteIncoming(items, live);
        const realVisitor = (items || []).some((m) => m && m.role === "visitor" && m.id && !String(m.id).startsWith("tmp_"));
        if ((items || []).some((m) => m && m.role === "visitor")) visitorHasSpoken = true;
        const agentArrived = (items || []).some((m) => m && m.role === "agent");
        if (agentArrived) setTypingHint(false);
        // Greeting-only opens never set visitorHasSpoken, so they still skip /read.
        // A real reply means the visitor is on this thread — tell the seat.
        if (visitorHasSpoken && (agentArrived || realVisitor)) markAgentMessagesRead("immediate");
      }
      function esc(s) {
        return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
      }
      function linkifyText(text) {
        const s = String(text || "");
        const re = /(https?:\/\/[^\s<]+|www\.[^\s<]+)/gi;
        let out = "";
        let last = 0;
        let m;
        while ((m = re.exec(s))) {
          out += esc(s.slice(last, m.index));
          let raw = m[0];
          let trail = "";
          while (/[.,;:!?)。，；！？、」』】）\]\}'"”’]+$/.test(raw)) {
            trail = raw.slice(-1) + trail;
            raw = raw.slice(0, -1);
          }
          if (!raw) {
            out += esc(m[0]);
            last = m.index + m[0].length;
            continue;
          }
          const href = /^https?:\/\//i.test(raw) ? raw : ("https://" + raw);
          out += `<a href="${esc(href)}" target="_blank" rel="noopener noreferrer">${esc(raw)}</a>` + esc(trail);
          last = m.index + m[0].length;
        }
        out += esc(s.slice(last));
        return out;
      }

      function copyChatLink(btn) {
        const raw = (btn && btn.getAttribute("data-copy")) || "";
        let text = raw;
        try { text = new URL(raw, location.href).href; } catch (_) {}
        const done = (ok) => {
          if (!btn) return;
          btn.textContent = ok ? "已复制" : "复制失败";
          setTimeout(() => { btn.textContent = "复制链接"; }, 1200);
        };
        const fallback = () => {
          try {
            const ta = document.createElement("textarea");
            ta.value = text;
            ta.setAttribute("readonly", "");
            ta.style.cssText = "position:fixed;left:-1000px;top:0";
            document.body.appendChild(ta);
            ta.select();
            const ok = document.execCommand("copy");
            ta.remove();
            return !!ok;
          } catch (_) { return false; }
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {

      async function pullFullHistory() {
        if (!sid || !vtok) return;
        // 全量拉取完整聊天记录（含自动回复），避免局部刷新把历史冲掉
        const savedLast = lastMsgId;
        lastMsgId = "";
        const wasBusy = pullBusy;
        pullBusy = false;
        try {
          const r = await fetch("/v1/visitor/sessions/" + sid + "/messages?_=" + Date.now(), {
            cache: "no-store",
            headers: visitorHeaders(),

            showRate(true);
            return;
          }
          if (Array.isArray(j.items)) {
            seenMsgIds.clear();
            render(j.items);
          } else {
            lastMsgId = savedLast;
          }
          closed = j.status === "history";
          rated = j.rating != null;

        } catch (_) {
          lastMsgId = savedLast;
        } finally {

        }
      }

      async function pull() {

      function schedulePull() {
        if (pullTimer) clearTimeout(pullTimer);
        if (!live) return;
        // A live socket can keep pinging while a reply frame is dropped.
        // Greeting-only pages stay quiet. Once the visitor has spoken, keep
        // pulling so both sides see new messages without a full refresh.
        const wsFresh = wsOk && lastWsAt && (Date.now() - lastWsAt < 40000);
        let wait = 2000;
        if (!visitorHasSpoken && wsFresh) wait = document.hidden ? 12000 : 8000;
        else if (document.hidden) wait = 6000;
        pullTimer = setTimeout(async () => { await pull(); schedulePull(); }, wait);
      }
      function connectVisitorWs() {
        if (!sid || !vtok || !wsWanted) return;
        try { if (wsObj) { wsObj.onclose = null; wsObj.close(); } } catch (_) {}
        try {
          const proto = location.protocol === "https:" ? "wss:" : "ws:";
          const ws = new WebSocket(
            proto + "//" + location.host + "/v1/ws/visitor?session_id=" + encodeURIComponent(sid)
            + "&visitor_token=" + encodeURIComponent(vtok)
          );
          wsObj = ws;
          ws.onopen = () => { wsRetry = 0; wsOk = true; lastWsAt = Date.now(); pull(); schedulePull(); };
          ws.onmessage = (ev) => {
            try {
              lastWsAt = Date.now();
              const msg = JSON.parse(ev.data);
              if (msg.event === "ping") { try { ws.send("pong"); } catch (_) {} return; }
              if (msg.event === "pong" || msg.event === "hello") return;
              if (msg.event === "session_closed") onSessionClosedUI();
              if (msg.event === "typing") {
                setTypingHint(!!(msg.data && msg.data.typing));
                return;
              }
              if (msg.event === "accepted" || msg.event === "session_accepted") {
                // 坐席接入后全量刷新，保留自动回复记录
                pullFullHistory();
                return;
              }
              if (msg.event === "message" && msg.data && msg.data.message) {
                appendItems([msg.data.message]);
                return;
              }
            } catch (_) {}
            pull();
          };
          ws.onclose = () => {
            wsOk = false;
            schedulePull();
            if (!wsWanted) return;
            wsRetry += 1;
            setTimeout(connectVisitorWs, Math.min(15000, 1000 * wsRetry));
          };
          ws.onerror = () => { try { ws.close(); } catch (_) {} };
        } catch (_) { wsOk = false; if (wsWanted) setTimeout(connectVisitorWs, 3000); }
      }

      function compressImageFile(file, opts) {
        const o = opts || {};
        const maxEdge = o.maxEdge || 960;
        const quality = o.quality == null ? 0.68 : o.quality;
        const maxBytes = o.maxBytes || 450 * 1024;
        if (!file || !/^image\//i.test(file.type || "")) return Promise.resolve(file);
        if (/gif/i.test(file.type) || (file.size && file.size <= 120 * 1024)) return Promise.resolve(file);
        const url = URL.createObjectURL(file);
        return new Promise((resolve) => {
          const im = new Image();
          im.onload = async () => {
            try {
              let w = im.naturalWidth || im.width, h = im.naturalHeight || im.height;
              let scale = Math.min(1, maxEdge / Math.max(w, h));
              w = Math.max(1, Math.round(w * scale)); h = Math.max(1, Math.round(h * scale));
              let canvas = document.createElement("canvas");
              canvas.width = w; canvas.height = h;
              canvas.getContext("2d").drawImage(im, 0, 0, w, h);
              let q = quality;
              let blob = await new Promise((r) => canvas.toBlob(r, "image/jpeg", q));
              while (blob && blob.size > maxBytes && q > 0.45) {
                q -= 0.07;
                blob = await new Promise((r) => canvas.toBlob(r, "image/jpeg", q));
              }
              let guard = 0;
              while (blob && blob.size > maxBytes && guard < 4 && Math.max(w, h) > 640) {
                guard += 1;
                w = Math.max(1, Math.round(w * 0.75));
                h = Math.max(1, Math.round(h * 0.75));
                const c2 = document.createElement("canvas");
                c2.width = w; c2.height = h;
                c2.getContext("2d").drawImage(canvas, 0, 0, w, h);
                canvas = c2;
                q = Math.min(q, 0.68);
                blob = await new Promise((r) => canvas.toBlob(r, "image/jpeg", q));
              }
              // Empty toBlob (some iOS/WebView cases) must NOT become a 0-byte upload.
              if (!blob || blob.size < 32 || (blob.size >= file.size * 0.98 && file.size <= maxBytes)) resolve(file);
              else resolve(new File([blob], (file.name || "image").replace(/\.\w+$/, "") + ".jpg", { type: "image/jpeg" }));
            } catch (_) { resolve(file); }
            finally { try { URL.revokeObjectURL(url); } catch (_) {} }
          };
          im.onerror = () => { try { URL.revokeObjectURL(url); } catch (_) {}; resolve(file); };
          im.src = url;
        });
      }

      async function uploadSend(file, kind) {
        if (!file || !sid || !vtok || closed) return;
        stopVisitorRemind();
        let sendFile = file;
        const wantImage = (kind || "file") === "image" || /^image\//i.test(file.type || "");
        if (wantImage && typeof compressImageFile === "function") {
          try { sendFile = await compressImageFile(file); } catch (_) { sendFile = file; }
        }
        if (!sendFile || !sendFile.size || sendFile.size < 32) {
          throw new Error("图片读取失败，请换一张图或改用相册原图重试");
        }
        const fd = new FormData();
        fd.append("file", sendFile);
        fd.append("kind", wantImage ? "image" : (kind || "file"));
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 90000);
        let meta;
        try {
          const r = await fetch("/v1/visitor/sessions/" + sid + "/upload", {
            method: "POST",
            headers: visitorHeaders(),
            body: fd,
            signal: ctrl.signal,
          });
          meta = await r.json().catch(() => ({}));
          if (!r.ok || !meta.file_url) throw new Error(detailText(meta.detail) || (r.status === 0 ? "上传超时" : "上传失败"));
        } catch (e) {
          if (e && e.name === "AbortError") throw new Error("上传超时，请检查网络后重试");
          throw e;
        } finally {
          clearTimeout(timer);
        }
        const j = await postVisitorMessage({
          text: meta.file_name || "",
          msg_type: meta.msg_type,
          file_url: meta.file_url,
          file_name: meta.file_name,
        });
        // items 通常只有刚发送的一条，整表 render 会清空自动回复历史
        const gotUp = j.message || (j.items && j.items[j.items.length - 1]);
        if (gotUp) appendItems([gotUp]);
        else if (j.items && j.items.length) appendItems(j.items);
      }
      document.getElementById("btnImg").onclick = () => document.getElementById("imgInput").click();
      document.getElementById("btnFile").onclick = () => document.getElementById("fileInput").click();
      document.getElementById("imgInput").onchange = async function () {
        const f = this.files && this.files[0]; this.value = "";
        if (!f) return;
        try { await uploadSend(f, "image"); } catch (e) { showErr(e.message || "发送失败"); }
      };
      document.getElementById("fileInput").onchange = async function () {
        const f = this.files && this.files[0]; this.value = "";
        if (!f) return;
        try { await uploadSend(f, "file"); } catch (e) { showErr(e.message || "发送失败"); }
      };

      function clearPendingPaste() {
        pendingPasteFile = null;
        if (pendingPasteUrl) {
          try { URL.revokeObjectURL(pendingPasteUrl); } catch (_) {}
        }
        pendingPasteUrl = "";
        const box = document.getElementById("pastePreview");
        const img = document.getElementById("pastePreviewImg");
        if (box) box.classList.remove("show");
        if (img) img.removeAttribute("src");
      }

      function setPendingPaste(file) {
        clearPendingPaste();
        pendingPasteFile = file;
        pendingPasteUrl = URL.createObjectURL(file);
        const box = document.getElementById("pastePreview");
        const img = document.getElementById("pastePreviewImg");
        if (img) img.src = pendingPasteUrl;
        if (box) box.classList.add("show");
      }

      function keepComposerFocus() {
        const el = document.getElementById("input");
        if (!el || el.disabled || closed) return;
        const go = () => {
          try { el.focus({ preventScroll: true }); } catch (_) { try { el.focus(); } catch (__) {} }
          try {
            const n = el.value.length;
            el.setSelectionRange(n, n);
          } catch (_) {}
        };
        go();
        requestAnimationFrame(go);
      }

      let sending = false;
      let sendArmedAt = 0;
      async function send() {
        if (sending || !sid || !vtok || closed) return;
        const text = input.value.trim();
        const pending = pendingPasteFile;
        if (!text && !pending) {
          keepComposerFocus();
          return;
        }
        sending = true;
        stopVisitorRemind();
        input.value = "";
        clearPendingPaste();
        showErr("");
        keepComposerFocus();
        try {
          if (pending) {
            await uploadSend(pending, "image");
          }
          if (text) {
            const clientMsgId = newClientMsgId();
            const tempId = "tmp_" + clientMsgId;
            const optimistic = {
              id: tempId,
              role: "visitor",
              text,
              time: new Date().toTimeString().slice(0, 5),
              msg_type: "text",
            };
            appendItems([optimistic]);
            try {
              const j = await postVisitorMessage({ text, client_msg_id: clientMsgId });
              const got = j.message || (j.items && j.items[j.items.length - 1]);
              seenMsgIds.delete(tempId);
              if (lastMsgId === tempId) lastMsgId = (got && got.id) || "";
              if (got) appendItems([got]);
              const tmpEl = msgs.querySelector('[data-mid="' + tempId + '"]');
              if (got && got.id && bubbleShown(got.id)) {
                if (tmpEl) tmpEl.remove();
              } else {
                pullFullHistory();
              }
              pull();
            } catch (sendErr) {
              const tmpEl = msgs.querySelector('[data-mid="' + tempId + '"]');
              if (tmpEl) tmpEl.classList.add("send-failed");
              throw sendErr;
            }
          }
        } catch (err) {
          showErr(err.message || "发送失败");
        } finally {
          sending = false;
          keepComposerFocus();
          setTimeout(keepComposerFocus, 0);
          setTimeout(keepComposerFocus, 50);
          setTimeout(keepComposerFocus, 180);
        }
      }
      function holdComposerFocus(e) {
        if (e) e.preventDefault();
        keepComposerFocus();
      }
      function fireSendFromButton(e) {
        if (e) e.preventDefault();
        const now = Date.now();
        if (now - sendArmedAt < 450) return;
        sendArmedAt = now;
        keepComposerFocus();
        send();
      }
      ["pointerdown", "mousedown", "touchstart"].forEach((evName) => {
        sendBtn.addEventListener(evName, holdComposerFocus, { passive: false });
      });
      sendBtn.addEventListener("pointerup", fireSendFromButton, { passive: false });
      sendBtn.addEventListener("touchend", fireSendFromButton, { passive: false });
      sendBtn.addEventListener("click", fireSendFromButton);
      input.onkeydown = (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          send();
        }
      };
      const pasteClearBtn = document.getElementById("pastePreviewClear");
      if (pasteClearBtn) pasteClearBtn.onclick = () => clearPendingPaste();

      function handlePasteImage(e) {
        if (!sid || !vtok || closed || input.disabled) return;
        const items = (e.clipboardData && e.clipboardData.items) ? Array.from(e.clipboardData.items) : [];
        let raw = null;
        for (const it of items) {
          if (it.kind === "file" && /^image\//i.test(it.type || "")) {
            raw = it.getAsFile();
            if (raw) break;
          }
        }
        if (!raw && e.clipboardData && e.clipboardData.files) {
          for (const f of Array.from(e.clipboardData.files)) {
            if (/^image\//i.test(f.type || "") || /\.(png|jpe?g|gif|webp|bmp)$/i.test(f.name || "")) {
              raw = f;
              break;
            }
          }
        }
        if (!raw) return;
        e.preventDefault();
        e.stopPropagation();
        showErr("");
        const name = raw.name && raw.name !== "image.png" ? raw.name : ("paste-" + Date.now() + ".png");
        const file = new File([raw], name, { type: raw.type || "image/png" });
        setPendingPaste(file);
      }
      // 只绑输入框，避免冒泡重复处理
      input.addEventListener("paste", handlePasteImage);

      function fitAppHeight() {
        try { window.scrollTo(0, 0); } catch (_) {}
        const vv = window.visualViewport;
        if (vv) {
          document.documentElement.style.setProperty("--app-h", Math.max(180, Math.round(vv.height)) + "px");
          document.documentElement.style.setProperty("--app-top", Math.round(vv.offsetTop) + "px");
        } else {
          document.documentElement.style.setProperty("--app-h", Math.round(window.innerHeight) + "px");
          document.documentElement.style.setProperty("--app-top", "0px");
        }
      }
      let lastViewportH = 0;
      function afterKeyboard() {
        fitAppHeight();
        requestAnimationFrame(() => {
          fitAppHeight();
          const vv = window.visualViewport;
          const h = vv ? vv.height : window.innerHeight;
          const shifted = lastViewportH && Math.abs(h - lastViewportH) > 48;
          lastViewportH = h;
          if (!shifted || !visitorPinned) return;
          const box = document.getElementById("msgs");
          if (box) box.scrollTop = box.scrollHeight;
        });
      }
      fitAppHeight();
      window.addEventListener("resize", afterKeyboard);
      window.addEventListener("orientationchange", () => setTimeout(afterKeyboard, 250));
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", afterKeyboard);
        window.visualViewport.addEventListener("scroll", afterKeyboard);
      }
      ["input", "leaveInput"].forEach((id) => {
        const el = document.getElementById(id);
        if (!el) return;
        el.addEventListener("focus", () => {
          setTimeout(afterKeyboard, 50);
          setTimeout(afterKeyboard, 320);
        });
        el.addEventListener("blur", () => setTimeout(() => {
          if (document.activeElement === el) return;
          afterKeyboard();
        }, 80));
      });
      document.getElementById("msgs").addEventListener("click", (e) => {
        const btn = e.target && e.target.closest ? e.target.closest(".copy-link") : null;
        if (btn) {
          e.preventDefault();
          e.stopPropagation();
          copyChatLink(btn);
          return;
        }
        openLinkBlank(e);
      });
      document.addEventListener("touchmove", (e) => {
        if (e.target && e.target.closest && e.target.closest("#msgs, textarea, input, .emoji-panel, #siteTabbar")) return;
        if (e.cancelable) e.preventDefault();
      }, { passive: false });


      // 底部导航 = 官网 tab；接待=客服页，其它项懒加载官网对应路由。
      // 内嵌官网 origin 来自加密配置，页面源码不写明文站点。
      (async function bindEmbedShell() {
        document.body.classList.add("embed-app");
        const shell = document.getElementById("chatShell");
        const frame = document.getElementById("siteEmbed");
        const tabbar = document.getElementById("siteTabbar");
        const params = new URLSearchParams(location.search);
        // 仅调试可用明文 embed_origin；正式走加密配置
        let siteOrigin = (params.get("embed_origin") || "").trim().replace(/\/$/, "");
        if (!siteOrigin && typeof window.__ocsDecryptSiteOrigin === "function") {
          try { siteOrigin = (await window.__ocsDecryptSiteOrigin()) || ""; } catch (_) { siteOrigin = ""; }
        }
        siteOrigin = String(siteOrigin || "").replace(/\/$/, "");
        if (siteOrigin) {
          try {
            document.documentElement.style.setProperty("--site-origin", siteOrigin);
            if (frame) frame.setAttribute("data-src", siteOrigin + "/?showBottomTab=false#/");
            var pre = document.createElement("link");
            pre.rel = "preconnect";
            pre.href = siteOrigin;
            document.head.appendChild(pre);
          } catch (_) {}
        }
        let mode = "chat";
        let currentHash = "#/";
        let lastFrameSrc = "";

        function siteUrl(hash) {
          let h = String(hash || "#/");
          // 六合资料走本站转发，其它外站地址原样内嵌。
          if (/^https?:\/\//i.test(h)) return h;
          if (h.charAt(0) === "/" && h.charAt(1) !== "/") return h;
          if (h.charAt(0) !== "#") h = "#/" + h.replace(/^\/?/, "");
          if (!siteOrigin) return "about:blank";
          // 官网自带底栏与外壳导航重复。站点读取 ?showBottomTab=false 后不渲染 v-bottom-navigation。
          const q = "showBottomTab=false";
          const search = h.indexOf("showBottomTab=") >= 0 ? "" : ("?" + q);
          return siteOrigin + "/" + search + h;
        }
        function ensureSite(hash) {
          if (!frame) return;
          currentHash = hash || currentHash || "#/";
          const next = siteUrl(currentHash);
          if (lastFrameSrc === next && frame.getAttribute("src") && frame.getAttribute("src") !== "about:blank") return;
          lastFrameSrc = next;
          try { frame.src = next; } catch (_) {}
        }
        function setActiveTab(which) {
          if (!tabbar) return;
          tabbar.querySelectorAll("button[data-tab]").forEach((b) => {
            const isChat = b.getAttribute("data-tab") === "chat";
            const hash = b.getAttribute("data-hash") || "";
            const on = which === "chat" ? isChat : (!isChat && hash === which);
            b.classList.toggle("active", on);
            b.setAttribute("aria-current", on ? "page" : "false");
          });
        }
        function isLiuhe(hash) {
          const h = String(hash || "");
          return h.indexOf("/liuhe/") >= 0 || h.indexOf("0199001.app") >= 0;
        }
        function syncLiuheChrome() {
          const on = mode === "site" && isLiuhe(currentHash);
          document.body.classList.toggle("liuhe-on", on);
          if (!frame) return;
          if (!on) {
            frame.style.top = "";
            frame.style.right = "";
            frame.style.bottom = "";
            frame.style.left = "";
            frame.style.height = "";
            return;
          }
          // 只裁内嵌固定 logo，保持澳门/香港开奖 + 列表样式；底边钉在 stage-main，不被 tabbar 挡住
          const crop = 56;
          const main = document.getElementById("stageMain");
          const mainH = main ? main.clientHeight : 0;
          document.documentElement.style.setProperty("--liuhe-crop", crop + "px");
          frame.style.top = "-" + crop + "px";
          frame.style.right = "0";
          frame.style.bottom = "0";
          frame.style.left = "0";
          frame.style.height = mainH > 0 ? (mainH + crop) + "px" : "auto";
        }
        function apply() {
          if (!shell) return;
          shell.classList.toggle("mode-site", mode === "site");
          shell.classList.toggle("mode-chat", mode === "chat");
          if (frame) frame.style.visibility = mode === "site" ? "visible" : "hidden";
          syncLiuheChrome();
        }
        function setMode(m, hash) {
          mode = m === "site" ? "site" : "chat";
          if (mode === "site") {
            ensureSite(hash || currentHash || "#/");
            setActiveTab(hash || currentHash || "#/");
          } else {
            setActiveTab("chat");
          }
          apply();
          try { window.__ocsEmbedMode = mode; } catch (_) {}
        }
        function onTab(btn) {
          if (!btn) return;
          const tab = btn.getAttribute("data-tab");
          const hash = btn.getAttribute("data-hash") || "#/";
          if (tab === "chat") setMode("chat");
          else setMode("site", hash || "#/");
        }
        if (tabbar) {
          tabbar.addEventListener("click", (e) => {
            const btn = e.target && e.target.closest ? e.target.closest("button[data-tab]") : null;
            if (!btn || !tabbar.contains(btn)) return;
            e.preventDefault();
            e.stopPropagation();
            onTab(btn);
          }, true);
        }
        // 打开即接待页；底栏顺序另排，不改默认落点。
        setMode("chat");
        // 空闲时再预取官网文档，点底部导航时少等源站一圈。
        const menuBtn = document.getElementById("liuheMenu");
        if (menuBtn) {
          menuBtn.addEventListener("click", (e) => {
            e.preventDefault();
            setMode("site", "#/");
          });
        }
        window.addEventListener("resize", () => { try { syncLiuheChrome(); } catch (_) {} });
        function warmSite(hash) {
          try {
            const href = siteUrl(hash || "#/");
            const raw = String(hash || "");
            const external = /^https?:\/\//i.test(raw) || (raw.charAt(0) === "/" && raw.charAt(1) !== "/");
            const mark = external ? "ext" : "1";
            if (document.querySelector('link[data-ocs-warm="' + mark + '"]')) return;
            const link = document.createElement("link");
            link.rel = "prefetch";
            link.as = "document";
            link.href = href;
            link.setAttribute("data-ocs-warm", mark);
            document.head.appendChild(link);
          } catch (_) {}
        }
        if (tabbar) {
          tabbar.addEventListener("pointerdown", (e) => {
            const btn = e.target && e.target.closest ? e.target.closest("button[data-tab]") : null;
            if (!btn || btn.getAttribute("data-tab") !== "site") return;
            const hash = btn.getAttribute("data-hash") || "#/";
            const external = /^https?:\/\//i.test(hash) || (hash.charAt(0) === "/" && hash.charAt(1) !== "/");
            warmSite(external ? hash : "#/");
          }, { passive: true });
        }
        const kickWarm = () => warmSite();
        if (window.requestIdleCallback) requestIdleCallback(kickWarm, { timeout: 1800 });
        else setTimeout(kickWarm, 1200);
        try {
          window.__ocsSetChatMode = setMode;
          window.__ocsClickTab = function (label) {
            if (!tabbar) return false;
            const buttons = tabbar.querySelectorAll("button[data-tab]");
            for (let i = 0; i < buttons.length; i++) {
              const lab = buttons[i].querySelector(".lab");
              if (lab && String(lab.textContent || "").trim() === String(label || "").trim()) {
                onTab(buttons[i]);
                return true;
              }
            }
            return false;
          };
        } catch (_) {}
      })();

      boot().catch((e) => showErr(e.message || "加载失败"));
    })();
  </script>
</body>
</html>
