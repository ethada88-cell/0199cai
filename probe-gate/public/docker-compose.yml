name: probe-gate

services:
  web:
    build: .
    image: probe-gate:local
    container_name: probe-gate
    restart: unless-stopped
    ports:
      - "127.0.0.1:18471:18471"
    volumes:
      - probe_data:/data
    environment:
      PORT: "18471"
      TZ: Asia/Hong_Kong
      DATA_DIR: "/data"
      ADMIN_PASS: "${ADMIN_PASS}"
      ALLOW_ORIGINS: "${ALLOW_ORIGINS:-*}"
      PROBE_MODE: "${PROBE_MODE:-popup}"
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18471/probe.js').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  probe_data:
