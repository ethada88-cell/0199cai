# probe-gate (traffic monitor) — isolated from online-cs
server {
    listen 80;
    listen [::]:80;
    server_name probe.ojy0871.com;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl;
    server_name probe.ojy0871.com;

    ssl_certificate     /www/server/panel/vhost/cert/cs.ojy0871.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/cs.ojy0871.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 4m;
    access_log /www/wwwlogs/probe-gate.access.log;
    error_log  /www/wwwlogs/probe-gate.error.log;

    location / {
        proxy_pass http://127.0.0.1:18471;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
