# Build iOS IPA on GitHub macOS runners.
# - unsigned: no Apple cert — for 企业签 / 第三方重签
# - ad-hoc / development: needs repository Secrets (see ios/GITHUB-IPA.md)
name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      app:
        description: Which shell to build
        required: true
        default: seat0199
        type: choice
        options:
          - app0199
          - seat0199
          - both
      export_method:
        description: unsigned=企业签用未签名包; ad-hoc/development=需证书 Secrets
        required: true
        default: unsigned
        type: choice
        options:
          - unsigned
          - ad-hoc
          - development

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve matrix
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.set.outputs.apps }}
    steps:
      - id: set
        run: |
          if [ "${{ inputs.app }}" = "both" ]; then
            echo 'apps=["app0199","seat0199"]' >> "$GITHUB_OUTPUT"
          else
            echo 'apps=["${{ inputs.app }}"]' >> "$GITHUB_OUTPUT"
          fi

  ipa:
    name: IPA ${{ matrix.app }} (${{ inputs.export_method }})
    needs: prepare
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.prepare.outputs.apps) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select project
        id: sel
        run: |
          case "${{ matrix.app }}" in
            app0199)
              echo "project=online-cs/deploy/mobile/ios/App0199/App0199/App0199.xcodeproj" >> "$GITHUB_OUTPUT"
              echo "scheme=App0199" >> "$GITHUB_OUTPUT"
              echo "bundle=com.ojy0871.app0199" >> "$GITHUB_OUTPUT"
              echo "ipa_name=App0199" >> "$GITHUB_OUTPUT"
              ;;
            seat0199)
              echo "project=online-cs/deploy/mobile/ios/Seat0199/Seat0199/Seat0199.xcodeproj" >> "$GITHUB_OUTPUT"
              echo "scheme=Seat0199" >> "$GITHUB_OUTPUT"
              echo "bundle=com.ojy0871.seat0199" >> "$GITHUB_OUTPUT"
              echo "ipa_name=Seat0199" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unknown app ${{ matrix.app }}" >&2
              exit 1
              ;;
          esac
          if [ "${{ inputs.export_method }}" = "development" ]; then
            echo "sign_identity=Apple Development" >> "$GITHUB_OUTPUT"
          else
            echo "sign_identity=Apple Distribution" >> "$GITHUB_OUTPUT"
          fi

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      # ---------- unsigned (企业签) ----------
      - name: Build unsigned .app
        if: inputs.export_method == 'unsigned'
        run: |
          BUILD_DIR="$RUNNER_TEMP/ios-build"
          mkdir -p "$BUILD_DIR"
          set -o pipefail
          xcodebuild \
            -project "${{ steps.sel.outputs.project }}" \
            -scheme "${{ steps.sel.outputs.scheme }}" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ONLY_ACTIVE_ARCH=NO \
            build
          APP=$(find "$RUNNER_TEMP/DerivedData" -path '*/Release-iphoneos/*.app' -type d | head -1)
          if [ -z "$APP" ]; then
            echo "Release-iphoneos .app not found; listing:"
            find "$RUNNER_TEMP/DerivedData" -name '*.app' -type d | head -50
            exit 1
          fi
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"
          echo "Built: $APP"
          ls -la "$APP"

      - name: Package unsigned IPA
        if: inputs.export_method == 'unsigned'
        run: |
          STAGE="$RUNNER_TEMP/ipa-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/Payload"
          cp -R "$APP_PATH" "$STAGE/Payload/"
          IPA_FILE="$RUNNER_TEMP/${{ steps.sel.outputs.ipa_name }}-unsigned.ipa"
          (
            cd "$STAGE"
            zip -qr "$IPA_FILE" Payload
          )
          ls -la "$IPA_FILE"
          unzip -l "$IPA_FILE" | head -30
          echo "IPA_FILE=$IPA_FILE" >> "$GITHUB_ENV"

      # ---------- signed (ad-hoc / development) ----------
      - name: Require signing secrets
        if: inputs.export_method != 'unsigned'
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          missing=0
          for k in IOS_CERTIFICATE_P12_BASE64 IOS_CERTIFICATE_PASSWORD IOS_PROVISION_PROFILE_BASE64 IOS_TEAM_ID KEYCHAIN_PASSWORD; do
            if [ -z "${!k}" ]; then
              echo "::error::Missing secret: $k — see online-cs/deploy/mobile/ios/GITHUB-IPA.md"
              missing=1
            fi
          done
          exit "$missing"

      - name: Import certificate and provisioning profile
        if: inputs.export_method != 'unsigned'
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          PP_PATH="$RUNNER_TEMP/build.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo "$IOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT_PATH"
          echo "$IOS_PROVISION_PROFILE_BASE64" | base64 --decode > "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$(security cms -D -i "$PP_PATH")")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' /dev/stdin <<< "$(security cms -D -i "$PP_PATH")")
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "PROVISION_UUID=$UUID" >> "$GITHUB_ENV"
          echo "PROVISION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "Imported profile: $NAME ($UUID)"

      - name: Write export options
        if: inputs.export_method != 'unsigned'
        env:
          OUT: ${{ runner.temp }}/ExportOptions.plist
          METHOD: ${{ inputs.export_method }}
          TEAM: ${{ secrets.IOS_TEAM_ID }}
          BUNDLE: ${{ steps.sel.outputs.bundle }}
          PROFILE: ${{ env.PROVISION_NAME }}
        run: |
          python3 <<'PY'
          import os
          from pathlib import Path
          out = Path(os.environ["OUT"])
          method = os.environ["METHOD"]
          team = os.environ["TEAM"]
          bundle = os.environ["BUNDLE"]
          profile = os.environ["PROFILE"]
          out.write_text(
              f"""<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          \t<key>method</key>
          \t<string>{method}</string>
          \t<key>teamID</key>
          \t<string>{team}</string>
          \t<key>signingStyle</key>
          \t<string>manual</string>
          \t<key>provisioningProfiles</key>
          \t<dict>
          \t\t<key>{bundle}</key>
          \t\t<string>{profile}</string>
          \t</dict>
          \t<key>compileBitcode</key>
          \t<false/>
          \t<key>stripSwiftSymbols</key>
          \t<true/>
          \t<key>thinning</key>
          \t<string>&lt;none&gt;</string>
          </dict>
          </plist>
          """,
              encoding="utf-8",
          )
          print(out.read_text())
          PY
          echo "EXPORT_OPTIONS=$OUT" >> "$GITHUB_ENV"

      - name: Archive signed
        if: inputs.export_method != 'unsigned'
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          ARCHIVE_PATH="$RUNNER_TEMP/${{ steps.sel.outputs.ipa_name }}.xcarchive"
          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"
          xcodebuild \
            -project "${{ steps.sel.outputs.project }}" \
            -scheme "${{ steps.sel.outputs.scheme }}" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="${{ steps.sel.outputs.sign_identity }}" \
            PROVISIONING_PROFILE="$PROVISION_UUID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROVISION_NAME" \
            archive

      - name: Export signed IPA
        if: inputs.export_method != 'unsigned'
        run: |
          EXPORT_DIR="$RUNNER_TEMP/ipa-out"
          mkdir -p "$EXPORT_DIR"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_DIR" \
            -exportOptionsPlist "$EXPORT_OPTIONS"
          ls -la "$EXPORT_DIR"
          IPA=$(find "$EXPORT_DIR" -name '*.ipa' | head -1)
          test -n "$IPA"
          cp "$IPA" "$RUNNER_TEMP/${{ steps.sel.outputs.ipa_name }}.ipa"
          echo "IPA_FILE=$RUNNER_TEMP/${{ steps.sel.outputs.ipa_name }}.ipa" >> "$GITHUB_ENV"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.sel.outputs.ipa_name }}-${{ inputs.export_method }}-ipa
          path: ${{ env.IPA_FILE }}
          if-no-files-found: error
          retention-days: 14
