# traffic-guard — 仅 llcj.mtekww.cn
# 检测与后台分上游：检测打满时后台仍可开
upstream tg_detect {
    server 127.0.0.1:43128;
    keepalive 128;
}
upstream tg_admin {
    server 127.0.0.1:43129;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name llcj.mtekww.cn;
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/traffic-guard/public;
        allow all;
        default_type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl;
    server_name llcj.mtekww.cn;

    ssl_certificate     /www/server/panel/vhost/cert/llcj.mtekww.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/llcj.mtekww.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;

    access_log /www/wwwlogs/traffic-guard.access.log;
    error_log  /www/wwwlogs/traffic-guard.error.log;

    location = /guard.js {
        alias /www/wwwroot/traffic-guard/public/guard.js;
        default_type application/javascript;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "public, max-age=120" always;
        etag on;
    }
    location = /guard-run.js {
        alias /www/wwwroot/traffic-guard/public/guard-run.js;
        default_type application/javascript;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "public, max-age=60" always;
        etag on;
    }

    # 后台 / 登录 / 管理 API → 专用进程
    location ^~ /admin {
        proxy_pass http://tg_admin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_connect_timeout 5s;
    }
    location ^~ /login {
        proxy_pass http://tg_admin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
    location ^~ /api/v1/admin/ {
        proxy_pass http://tg_admin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # 检测热路径：短超时，避免慢请求占满连接；conn 上限仅防进程被拖死，不是业务限流
    location = /api/v1/check {
        limit_conn tg_detect_conn 2000;
        limit_conn_status 503;
        proxy_pass http://tg_detect;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 2s;
        proxy_send_timeout 4s;
        proxy_read_timeout 4s;
    }
    location = /api/v1/popup {
        limit_conn tg_detect_conn 2000;
        limit_conn_status 503;
        proxy_pass http://tg_detect;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 2s;
        proxy_send_timeout 4s;
        proxy_read_timeout 4s;
    }

    # 其它（含 ping）→ 检测进程
    location / {
        proxy_pass http://tg_detect;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 15s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
    }
}
