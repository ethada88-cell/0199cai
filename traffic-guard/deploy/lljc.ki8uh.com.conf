server {
    listen 80;
    listen [::]:80;
    server_name lljc.ki8uh.com;
    location ^~ /.well-known/ {
        alias /www/wwwroot/ki8uh.com/.well-known/;
        allow all;
        default_type text/plain;
    }
    location / {
        return 301 https://lljc.ki8uh.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lljc.ki8uh.com;
    ssl_certificate /www/server/panel/vhost/cert/ki8uh.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/ki8uh.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:43128;
        proxy_http_version 1.1;
        proxy_cache off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
