# fenliuqi — linegate (线路台), not online-cs
upstream fenliuqi_linegate {
    server 127.0.0.1:43127;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name fenliuqi.ojy0871.com;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl;
    server_name fenliuqi.ojy0871.com;

    ssl_certificate     /www/server/panel/vhost/cert/cs.ojy0871.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/cs.ojy0871.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 20m;
    access_log /www/wwwlogs/fenliuqi.access.log;
    error_log  /www/wwwlogs/fenliuqi.error.log;

    location / {
        proxy_pass http://fenliuqi_linegate;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
