# fenliuqi — empty project (not online-cs)
server {
    listen 80;
    listen [::]:80;
    server_name fenliuqi.ojy0871.com;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl;
    server_name fenliuqi.ojy0871.com;

    ssl_certificate     /www/server/panel/vhost/cert/cs.ojy0871.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/cs.ojy0871.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /www/wwwroot/fenliuqi/web;
    index index.html;
    access_log /www/wwwlogs/fenliuqi.access.log;
    error_log  /www/wwwlogs/fenliuqi.error.log;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
