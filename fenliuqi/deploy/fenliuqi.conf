# fenliuqi — isolated Online CS (native), separate from online-cs / probe-gate
map $uri $fenliuqi_agent_cache {
    default "public, max-age=604800";
    /agent/ "no-store, no-cache, must-revalidate";
    /agent/index.html "no-store, no-cache, must-revalidate";
}

upstream fenliuqi_api {
    server 127.0.0.1:19088 max_fails=2 fail_timeout=15s;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name fenliuqi.ojy0871.com;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl;
    server_name fenliuqi.ojy0871.com;

    ssl_certificate     /www/server/panel/vhost/cert/cs.ojy0871.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/cs.ojy0871.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 25m;
    absolute_redirect off;
    root /www/wwwroot/fenliuqi/web;
    index index.html;
    access_log /www/wwwlogs/fenliuqi.access.log;
    error_log  /www/wwwlogs/fenliuqi.error.log;

    location = /favicon.ico { alias /www/wwwroot/fenliuqi/web/favicon.ico; access_log off; }
    location = /embed.js { alias /www/wwwroot/fenliuqi/web/embed.js; add_header Access-Control-Allow-Origin *; }

    location /media/ {
        proxy_pass http://fenliuqi_api/media/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    location ~ ^/v1/(agent|visitor)/.*upload$ {
        proxy_pass http://fenliuqi_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 25m;
        proxy_read_timeout 120s;
    }

    location ^~ /v1/ws/ {
        proxy_pass http://fenliuqi_api/v1/ws/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location /v1/ {
        proxy_pass http://fenliuqi_api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        add_header Cache-Control "no-store";
    }

    location /login/ { alias /www/wwwroot/fenliuqi/web/login/; try_files $uri $uri/ /login/index.html; add_header Cache-Control "no-store"; }
    location /agent/ { alias /www/wwwroot/fenliuqi/web/agent/; try_files $uri $uri/ /agent/index.html; add_header Cache-Control $fenliuqi_agent_cache; }
    location = /agent/app.js { alias /www/wwwroot/fenliuqi/web/agent/app.js; add_header Cache-Control "no-store"; }
    location /setting/ { root /www/wwwroot/fenliuqi/web; try_files $uri $uri/ /setting/index.html; }
    location /platform/ { alias /www/wwwroot/fenliuqi/web/platform/; try_files $uri $uri/ /platform/index.html; }
    location /company/ { alias /www/wwwroot/fenliuqi/web/company/; try_files $uri $uri/ /company/index.html; }
    location /visitor/ { alias /www/wwwroot/fenliuqi/web/visitor/; try_files $uri $uri/ /visitor/index.html; }

    location = / {
        return 302 /login/;
    }

    location /c/ {
        alias /www/wwwroot/fenliuqi/web/c/;
        try_files $uri $uri/ /c/index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
}
