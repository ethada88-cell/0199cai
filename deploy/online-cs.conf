map $http_x_real_ip $ocs_client_ip {
    ""      $remote_addr;
    default $http_x_real_ip;
}
map $uri $ocs_agent_cache {
    default "public, max-age=604800";
    /agent/ "no-store, no-cache, must-revalidate";
    /agent/index.html "no-store, no-cache, must-revalidate";
}
upstream ocs_api {
    server 127.0.0.1:8088 max_fails=2 fail_timeout=15s;
    keepalive 16;
}

# Apex / www: closed (even if DNS points here)
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl;
    server_name ojy0871.com www.ojy0871.com;
    ssl_certificate     /www/server/panel/vhost/cert/cs.ojy0871.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/cs.ojy0871.com/privkey.pem;
    return 444;
}

# HTTP: ACME + redirect to HTTPS for console/subdomains
server {
    listen 80;
    listen [::]:80;
    server_name cs.ojy0871.com *.ojy0871.com;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/online-cs/web;
        default_type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# Optional IP HTTP fallback (no force HTTPS)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 18888;
    listen [::]:18888;
    server_name 203.135.101.229 _;

    client_max_body_size 25m;
    absolute_redirect off;
    root /www/wwwroot/online-cs/web;
    index index.html;
    access_log /www/wwwlogs/online-cs-ip.access.log;
    error_log  /www/wwwlogs/online-cs-ip.error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/online-cs/web;
        default_type text/plain;
    }

    location = /favicon.ico { alias /www/wwwroot/online-cs/web/favicon.ico; access_log off; }
    location = /embed.js { alias /www/wwwroot/online-cs/web/embed.js; add_header Access-Control-Allow-Origin *; }
    location /media/ {
        proxy_pass http://ocs_api/media/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $ocs_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
    location ^~ /v1/ws/ {
        proxy_pass http://ocs_api/v1/ws/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $ocs_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
    location /v1/ {
        proxy_pass http://ocs_api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $ocs_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        add_header Cache-Control "no-store";
    }
    location /login/ { alias /www/wwwroot/online-cs/web/login/; try_files $uri $uri/ /login/index.html; add_header Cache-Control "no-store"; }
    location /agent/ { alias /www/wwwroot/online-cs/web/agent/; try_files $uri $uri/ /agent/index.html; add_header Cache-Control $ocs_agent_cache; }
    location = /agent/app.js { alias /www/wwwroot/online-cs/web/agent/app.js; add_header Cache-Control "no-store"; }
    location /setting/ { root /www/wwwroot/online-cs/web; try_files $uri $uri/ /setting/index.html; }
    location /platform/ { alias /www/wwwroot/online-cs/web/platform/; try_files $uri $uri/ /platform/index.html; }
    location /company/ { alias /www/wwwroot/online-cs/web/company/; try_files $uri $uri/ /company/index.html; }
    location /visitor/ { alias /www/wwwroot/online-cs/web/visitor/; try_files $uri $uri/ /visitor/index.html; }
    location = / { return 302 /login/; }

    # Force mobile UA when embedding 0199w.com inside visitor CS page
    location ^~ /_m/0199w/ {
        proxy_pass https://0199w.com/;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_set_header Host 0199w.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header User-Agent "Mozilla/5.0 (iPhone; CPU iPhone OS 16_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/16.6 Mobile/15E148 Safari/604.1";
        proxy_set_header Accept-Encoding "";
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_cookie_domain 0199w.com $host;
        add_header X-Frame-Options "" always;
    }

    location /c/ {
        alias /www/wwwroot/online-cs/web/c/;
        try_files $uri /c/index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
}

# HTTPS main: wildcard LE cert
server {
    listen 443 ssl http2;
    listen [::]:443 ssl;
    server_name cs.ojy0871.com *.ojy0871.com;

    ssl_certificate     /www/server/panel/vhost/cert/cs.ojy0871.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/cs.ojy0871.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 25m;
    absolute_redirect off;
    root /www/wwwroot/online-cs/web;
    index index.html;
    access_log /www/wwwlogs/online-cs.access.log;
    error_log  /www/wwwlogs/online-cs.error.log;

    location = /favicon.ico { alias /www/wwwroot/online-cs/web/favicon.ico; access_log off; }
    location = /embed.js { alias /www/wwwroot/online-cs/web/embed.js; add_header Access-Control-Allow-Origin *; }

    location /media/ {
        proxy_pass http://ocs_api/media/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $ocs_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }
    location ~ ^/v1/(agent|visitor)/.*upload$ {
        proxy_pass http://ocs_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $ocs_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 25m;
        proxy_read_timeout 120s;
    }
    location ^~ /v1/ws/ {
        proxy_pass http://ocs_api/v1/ws/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $ocs_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
    location /v1/ {
        proxy_pass http://ocs_api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $ocs_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        add_header Cache-Control "no-store";
    }
    location /login/ { alias /www/wwwroot/online-cs/web/login/; try_files $uri $uri/ /login/index.html; add_header Cache-Control "no-store"; }
    location /agent/ { alias /www/wwwroot/online-cs/web/agent/; try_files $uri $uri/ /agent/index.html; add_header Cache-Control $ocs_agent_cache; }
    location = /agent/app.js { alias /www/wwwroot/online-cs/web/agent/app.js; add_header Cache-Control "no-store"; }
    location /setting/ { root /www/wwwroot/online-cs/web; try_files $uri $uri/ /setting/index.html; }
    location /platform/ { alias /www/wwwroot/online-cs/web/platform/; try_files $uri $uri/ /platform/index.html; }
    location /company/ { alias /www/wwwroot/online-cs/web/company/; try_files $uri $uri/ /company/index.html; }
    location /visitor/ { alias /www/wwwroot/online-cs/web/visitor/; try_files $uri $uri/ /visitor/index.html; }

    # Console host -> login; other subdomains use visitor gate when /c/
    location = / {
        if ($host = cs.ojy0871.com) { return 302 /login/; }
        # ephemeral subdomain landing still goes to login/chat via /c/
        return 302 /login/;
    }

    # Force mobile UA when embedding 0199w.com inside visitor CS page
    location ^~ /_m/0199w/ {
        proxy_pass https://0199w.com/;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_set_header Host 0199w.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header User-Agent "Mozilla/5.0 (iPhone; CPU iPhone OS 16_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/16.6 Mobile/15E148 Safari/604.1";
        proxy_set_header Accept-Encoding "";
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_cookie_domain 0199w.com $host;
    }

    # 六合资料：转发内页并藏掉 6662 顶栏和六合网横幅，外面再盖 0199 顶栏。
    location ^~ /liuhe/ {
        proxy_pass https://dactfpsnp1.6662bb.app:2678/;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_set_header Host dactfpsnp1.6662bb.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Accept-Encoding "";
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering on;
        proxy_read_timeout 60s;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_redirect https://dactfpsnp1.6662bb.app:2678/ /liuhe/;
        add_header Content-Security-Policy "frame-ancestors *" always;
        subs_filter '</head>' '<style>.header .logo{display:none!important}img[src*="logo6662"]{display:none!important}</style><script>function ocsLiuheFit(){var logo=document.querySelector(".header .logo");if(logo)logo.style.setProperty("display","none","important");var imgs=document.images;for(var i=0;i<imgs.length;i++){var src=imgs[i].getAttribute("src")||"";if(src.indexOf("logo6662")>=0&&imgs[i].parentElement)imgs[i].parentElement.style.setProperty("display","none","important");}var header=document.querySelector(".header");var spacer=header&&header.nextElementSibling;if(header&&spacer)spacer.style.marginTop=header.offsetHeight+"px";}if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",ocsLiuheFit);else ocsLiuheFit();window.addEventListener("load",ocsLiuheFit);setTimeout(ocsLiuheFit,400);setTimeout(ocsLiuheFit,1200);</script></head>';
    }

    location /c/ {
        alias /www/wwwroot/online-cs/web/c/;
        try_files $uri /c/index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
}

# Mobile embed reverse-proxy for 0199w.com (forces mobile UA; full site paths work)
server {
    listen 80;
    listen [::]:80;
    server_name m.ojy0871.com;
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl;
    server_name m.ojy0871.com;

    ssl_certificate     /www/server/panel/vhost/cert/cs.ojy0871.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/cs.ojy0871.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 25m;
    access_log /www/wwwlogs/online-cs-membed.access.log;
    error_log  /www/wwwlogs/online-cs-membed.error.log;

    location / {
        proxy_pass https://0199w.com;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_set_header Host 0199w.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header User-Agent "Mozilla/5.0 (iPhone; CPU iPhone OS 16_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/16.6 Mobile/15E148 Safari/604.1";
        proxy_set_header Accept-Encoding "";
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering on;
        proxy_read_timeout 120s;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Cache-Control;
        proxy_cache ocs_msite;
        proxy_cache_key $scheme$host$request_uri;
        proxy_cache_valid 200 10m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cookie_domain 0199w.com m.ojy0871.com;
        add_header Cache-Control "public, max-age=600" always;
        # Hide the embedded site's download-app bar (强烈推荐下载APP).
        subs_filter '</head>' '<style>.downloadbar{display:none!important}</style></head>';
        # Allow framing from our CS domains
        add_header Content-Security-Policy "frame-ancestors *" always;
    }
}

